# 手动触发部署；仅发布已审核的青途与六个获选页面，不包含其他项目或内部核对材料。
name: Deploy Qingtu and selected demos to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare approved site payload
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R qingtu-app template luoxiaohei pet-world personal-intro cutovo _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact indexing
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
